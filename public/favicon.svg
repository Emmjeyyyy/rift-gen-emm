<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark space background -->
  <rect width="512" height="512" rx="120" fill="#020510" />
  
  <!-- Glowing cyan tear/rift -->
  <path d="M350 100 L210 260 L270 260 L150 420 L290 280 L230 280 Z" fill="#00f0ff" filter="url(#glow)" />
  
  <!-- Bright white core for intense heat -->
  <path d="M350 100 L210 260 L270 260 L150 420 L290 280 L230 280 Z" fill="#ffffff" />
</svg>